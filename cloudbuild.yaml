# Cloud Build configuration for Librarian
# This file is used for automated builds with Google Cloud Build

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/librarian:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/librarian:latest'
      - '.'
    timeout: 900s

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/librarian:$COMMIT_SHA'
    timeout: 600s

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/librarian:latest'
    timeout: 600s

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'librarian'
      - '--image'
      - 'gcr.io/$PROJECT_ID/librarian:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GCS_BUCKET_PDFS=${_GCS_BUCKET_PDFS},GCS_BUCKET_VECTORS=${_GCS_BUCKET_VECTORS}'
      - '--set-secrets'
      - 'OPENAI_API_KEY=openai-api-key:latest'
    timeout: 600s

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/librarian:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/librarian:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for entire build
timeout: 1800s

# Substitutions for environment-specific values
substitutions:
  _GCS_BUCKET_PDFS: '${PROJECT_ID}-librarian-pdfs'
  _GCS_BUCKET_VECTORS: '${PROJECT_ID}-librarian-vectors'
